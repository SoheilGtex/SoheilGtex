<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 430" role="img" aria-labelledby="title desc">
  <title id="title">Soheil Salmani | Mathematics × DevOps</title>
  <desc id="desc">A chalkboard-inspired bridge from mathematics to reliable systems engineering.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0d12"/>
      <stop offset="0.55" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#10131b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#65b8ff"/>
      <stop offset="0.55" stop-color="#7f8cff"/>
      <stop offset="1" stop-color="#9a6cff"/>
    </linearGradient>
    <filter id="chalk" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.95" numOctaves="1" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="3" seed="11" result="turb"/>
      <feColorMatrix in="turb" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray" result="fade">
        <feFuncA type="table" tableValues="0 0.07"/>
      </feComponentTransfer>
    </filter>
    <style>
      .chalk { fill:none; stroke:#e8edf3; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; opacity:.78; filter:url(#chalk); }
      .chalk2 { fill:none; stroke:#a9b4c2; stroke-width:1.4; stroke-linecap:round; stroke-linejoin:round; opacity:.42; }
      .math { fill:#e7ebf2; opacity:.83; font-family: Georgia, 'Times New Roman', serif; font-style:italic; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .sans { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .label { fill:#8d99aa; font-size:16px; letter-spacing:3px; }
      .box { fill:#111722; stroke:#dfe6ef; stroke-width:1.7; opacity:.95; }
      .accent { fill:none; stroke:url(#accent); stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
      .accentThin { fill:none; stroke:url(#accent); stroke-width:2; stroke-linecap:round; stroke-linejoin:round; opacity:.75; }
    </style>
  </defs>

  <rect width="1600" height="430" rx="24" fill="url(#bg)"/>
  <rect width="1600" height="430" rx="24" filter="url(#grain)" opacity=".7"/>

  <!-- subtle chalkboard scratches -->
  <g opacity=".16" stroke="#d8dde6" stroke-width="1">
    <path d="M40 64 C260 26 400 92 560 52"/>
    <path d="M82 362 C310 326 480 388 690 352"/>
    <path d="M1040 74 C1210 40 1380 94 1540 60"/>
    <path d="M1160 354 C1320 326 1460 372 1560 342"/>
  </g>

  <!-- identity -->
  <text x="76" y="82" class="sans" fill="#f4f7fb" font-size="28" font-weight="700" letter-spacing="1.5">SOHEIL SALMANI</text>
  <text x="77" y="112" class="mono" fill="#8e9bad" font-size="15" letter-spacing="2.2">DEVOPS ENGINEER  ×  MATHEMATICS</text>

  <!-- mathematics side -->
  <g transform="translate(78,146)">
    <!-- axes + bell curve -->
    <path class="chalk2" d="M0 110 H280 M70 154 V10"/>
    <path class="chalk" d="M16 108 C55 108 58 86 72 58 C88 28 112 22 128 58 C145 94 169 107 252 108"/>
    <line class="chalk2" x1="128" y1="58" x2="128" y2="108" stroke-dasharray="5 7"/>
    <text x="170" y="28" class="math" font-size="26">p(x)</text>
    <text x="159" y="53" class="math" font-size="18">μ, σ²</text>

    <!-- sine -->
    <path class="chalk" d="M12 182 C42 148 68 148 96 182 C124 216 151 216 178 182 C205 148 231 148 263 182"/>
    <path class="chalk2" d="M0 182 H278"/>
    <text x="14" y="224" class="math" font-size="24">f(x)=∑ aₙ sin(nx)+bₙ cos(nx)</text>

    <!-- formulas -->
    <text x="318" y="28" class="math" font-size="27">∫ f(x) dx</text>
    <text x="318" y="70" class="math" font-size="24">Ax = b</text>
    <text x="318" y="112" class="math" font-size="24">∇f(x)=0</text>
    <text x="318" y="154" class="math" font-size="24">P(A∩B)</text>
    <text x="318" y="196" class="math" font-size="24">xₖ₊₁=xₖ−η∇f(xₖ)</text>

    <!-- small matrix -->
    <path class="chalk2" d="M460 36 v104 M550 36 v104"/>
    <text x="476" y="61" class="math" font-size="18">a₁₁  a₁₂</text>
    <text x="476" y="92" class="math" font-size="18">a₂₁  a₂₂</text>
    <text x="492" y="123" class="math" font-size="18">⋮   ⋱</text>
  </g>

  <!-- bridge -->
  <g>
    <path class="accent" d="M620 252 C700 214 754 208 824 235 C894 262 925 260 980 225"/>
    <path class="accentThin" d="M620 266 C700 228 754 222 824 249 C894 276 925 274 980 239"/>
    <path class="accentThin" d="M620 238 C700 200 754 194 824 221 C894 248 925 246 980 211"/>
    <circle cx="620" cy="252" r="4" fill="#72b8ff"/>
    <circle cx="980" cy="225" r="4" fill="#9a6cff"/>
    <text x="694" y="190" class="mono label">STRUCTURE</text>
    <text x="845" y="190" class="mono label">SYSTEMS</text>
    <path d="M800 184 H829" stroke="#667386" stroke-width="1.5"/>
    <path d="M823 178 L831 184 L823 190" fill="none" stroke="#667386" stroke-width="1.5"/>
  </g>

  <!-- DevOps pipeline -->
  <g transform="translate(920,102) scale(.68)">
    <!-- code -->
    <rect class="box" x="0" y="42" width="92" height="74" rx="12"/>
    <path class="chalk" d="M29 68 l-13 11 13 11 M62 68 l13 11-13 11 M52 62 l-11 34"/>
    <text x="13" y="140" class="mono" fill="#8c99ab" font-size="14">CODE</text>

    <!-- arrow -->
    <path class="accentThin" d="M96 79 H134"/>
    <path class="accentThin" d="M127 73 l8 6-8 6"/>

    <!-- test/automation -->
    <rect class="box" x="142" y="42" width="92" height="74" rx="12"/>
    <circle class="chalk" cx="176" cy="79" r="15"/>
    <circle class="chalk" cx="204" cy="79" r="11"/>
    <path class="chalk2" d="M176 59 V51 M176 107 V99 M156 79 H148 M204 61 V54 M204 104 V97 M222 79 H230"/>
    <text x="153" y="140" class="mono" fill="#8c99ab" font-size="14">AUTOMATE</text>

    <path class="accentThin" d="M238 79 H276"/>
    <path class="accentThin" d="M269 73 l8 6-8 6"/>

    <!-- checks -->
    <rect class="box" x="284" y="42" width="92" height="74" rx="12"/>
    <path class="chalk" d="M304 66 l7 7 12-15 M304 82 l7 7 12-15 M304 98 l7 7 12-15"/>
    <path class="chalk2" d="M334 66 H356 M334 82 H356 M334 98 H356"/>
    <text x="299" y="140" class="mono" fill="#8c99ab" font-size="14">VERIFY</text>

    <path class="accentThin" d="M380 79 H418"/>
    <path class="accentThin" d="M411 73 l8 6-8 6"/>

    <!-- container -->
    <g transform="translate(426,42)">
      <path class="chalk" d="M15 14 L46 0 L77 14 L46 29 Z M15 14 V56 L46 72 L77 56 V14 M46 29 V72"/>
      <path class="chalk2" d="M29 8 L60 22 M60 8 L29 22"/>
    </g>
    <text x="434" y="140" class="mono" fill="#8c99ab" font-size="14">PACKAGE</text>

    <!-- loop down -->
    <path class="accent" d="M504 78 C548 78 556 92 556 123 V152 C556 176 573 186 603 186"/>

    <!-- server -->
    <g transform="translate(606,153)">
      <rect class="box" x="0" y="0" width="86" height="28" rx="6"/>
      <rect class="box" x="0" y="34" width="86" height="28" rx="6"/>
      <rect class="box" x="0" y="68" width="86" height="28" rx="6"/>
      <circle cx="12" cy="14" r="2.7" fill="#73b9ff"/>
      <circle cx="12" cy="48" r="2.7" fill="#7f8cff"/>
      <circle cx="12" cy="82" r="2.7" fill="#9a6cff"/>
    </g>

    <!-- db -->
    <path class="chalk" d="M724 169 C724 160 748 153 768 153 C788 153 812 160 812 169 V237 C812 246 788 253 768 253 C748 253 724 246 724 237 Z"/>
    <path class="chalk2" d="M724 169 C724 178 748 185 768 185 C788 185 812 178 812 169 M724 203 C724 212 748 219 768 219 C788 219 812 212 812 203"/>

    <!-- monitor -->
    <rect class="box" x="845" y="153" width="105" height="72" rx="8"/>
    <path class="chalk" d="M858 205 l18-15 16 7 18-23 22 12"/>
    <path class="chalk2" d="M872 237 H924 M898 225 V237"/>
    <text x="605" y="278" class="mono" fill="#8c99ab" font-size="14">DEPLOY</text>
    <text x="735" y="278" class="mono" fill="#8c99ab" font-size="14">STATE</text>
    <text x="856" y="278" class="mono" fill="#8c99ab" font-size="14">OBSERVE</text>

    <path class="accentThin" d="M694 201 H720 M814 201 H841"/>
    <path class="accentThin" d="M713 195 l8 6-8 6 M834 195 l8 6-8 6"/>
  </g>

  <text x="1002" y="382" class="sans" fill="#eef3f9" font-size="22" font-weight="600">structure → automation → reliability</text>
  <text x="1004" y="407" class="mono" fill="#718096" font-size="14">mathematical thinking, engineered systems</text>
</svg>
