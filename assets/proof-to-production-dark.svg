<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 470" role="img" aria-labelledby="title desc">
  <title id="title">Soheil Salmani — Mathematics × DevOps</title>
  <desc id="desc">A proof-to-production loop connecting mathematical reasoning to reliable systems engineering.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a0f"/>
      <stop offset="0.48" stop-color="#0b1017"/>
      <stop offset="1" stop-color="#0b0d14"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#62c3ff"/>
      <stop offset="0.52" stop-color="#7a82ff"/>
      <stop offset="1" stop-color="#b46cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7b89ff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#7b89ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="17" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="g"/>
      <feComponentTransfer in="g"><feFuncA type="table" tableValues="0 0.045"/></feComponentTransfer>
    </filter>
    <style>
      .sans{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
      .math{font-family:Georgia,'Times New Roman',serif;font-style:italic}
      .fine{fill:none;stroke:#7c8999;stroke-width:1.3;opacity:.46;stroke-linecap:round;stroke-linejoin:round}
      .chalk{fill:none;stroke:#e8edf5;stroke-width:1.8;opacity:.76;stroke-linecap:round;stroke-linejoin:round}
      .box{fill:#0e141e;stroke:#9eabba;stroke-width:1.3}
      .flow{fill:none;stroke:url(#flow);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .flow2{fill:none;stroke:url(#flow);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.58}
    </style>
  </defs>

  <rect width="1600" height="470" rx="22" fill="url(#bg)"/>
  <ellipse cx="935" cy="244" rx="390" ry="190" fill="url(#glow)" filter="url(#soft)"/>
  <rect width="1600" height="470" rx="22" filter="url(#grain)" opacity=".8"/>

  <!-- top identity -->
  <text x="62" y="68" class="sans" fill="#f5f7fb" font-size="29" font-weight="760" letter-spacing="1.1">SOHEIL SALMANI</text>
  <text x="63" y="99" class="mono" fill="#8693a5" font-size="14" letter-spacing="2.1">MATHEMATICS  ↔  DEVOPS</text>
  <text x="1292" y="69" class="mono" fill="#728094" font-size="13" text-anchor="end">proof → pipeline → feedback</text>

  <!-- left: mathematical board -->
  <g transform="translate(58,132)">
    <text x="0" y="0" class="mono" fill="#687588" font-size="12" letter-spacing="2">REASON</text>
    <path class="fine" d="M0 95 H315 M74 145 V27"/>
    <path class="chalk" d="M12 94 C46 94 56 74 72 50 C91 20 116 24 132 54 C151 88 178 95 300 95"/>
    <line class="fine" x1="132" y1="54" x2="132" y2="95" stroke-dasharray="4 7"/>
    <text x="175" y="34" class="math" fill="#e4eaf1" font-size="23">p(x)</text>
    <text x="176" y="57" class="math" fill="#9ba8b8" font-size="17">μ, σ²</text>

    <text x="344" y="35" class="math" fill="#e8edf4" font-size="25">Ax = b</text>
    <text x="344" y="78" class="math" fill="#e8edf4" font-size="24">∇f(x)=0</text>
    <text x="344" y="121" class="math" fill="#e8edf4" font-size="22">P(A|B)</text>
    <text x="344" y="164" class="math" fill="#e8edf4" font-size="22">xₖ₊₁=xₖ−η∇f(xₖ)</text>

    <path class="fine" d="M2 206 H310"/>
    <path class="chalk" d="M14 206 C40 170 70 170 98 206 C126 242 154 242 182 206 C210 170 240 170 296 206"/>
    <text x="0" y="258" class="math" fill="#dbe2eb" font-size="22">f(x)=∑ aₙsin(nx)+bₙcos(nx)</text>
  </g>

  <!-- central bridge -->
  <g>
    <path id="mainPath" class="flow" d="M570 276 C655 206 739 204 818 260 C895 315 961 312 1034 246"/>
    <path class="flow2" d="M570 292 C655 222 739 220 818 276 C895 331 961 328 1034 262"/>
    <path class="flow2" d="M570 260 C655 190 739 188 818 244 C895 299 961 296 1034 230"/>
    <text x="650" y="183" class="mono" fill="#77859a" font-size="12" letter-spacing="2">MODEL</text>
    <text x="802" y="183" class="mono" fill="#77859a" font-size="12" letter-spacing="2">AUTOMATE</text>
    <text x="949" y="183" class="mono" fill="#77859a" font-size="12" letter-spacing="2">VERIFY</text>
  </g>

  <!-- right: systems pipeline -->
  <g transform="translate(1044,126)">
    <text x="0" y="6" class="mono" fill="#687588" font-size="12" letter-spacing="2">OPERATE</text>

    <rect class="box" x="0" y="42" width="92" height="68" rx="12"/>
    <path class="chalk" d="M28 65 l-12 11 12 11 M61 65 l12 11-12 11 M51 60 l-10 32"/>
    <text x="46" y="132" class="mono" fill="#8996a8" font-size="12" text-anchor="middle">CODE</text>

    <path class="flow2" d="M98 76 H134"/>
    <path class="flow2" d="M127 70 l8 6-8 6"/>

    <rect class="box" x="142" y="42" width="92" height="68" rx="12"/>
    <path class="chalk" d="M162 65 l8 8 13-17 M162 83 l8 8 13-17"/>
    <path class="fine" d="M193 65 H216 M193 83 H216"/>
    <text x="188" y="132" class="mono" fill="#8996a8" font-size="12" text-anchor="middle">TEST</text>

    <path class="flow2" d="M240 76 H276"/>
    <path class="flow2" d="M269 70 l8 6-8 6"/>

    <g transform="translate(288,48)">
      <path class="chalk" d="M8 12 L38 0 L68 12 L38 27 Z M8 12 V52 L38 67 L68 52 V12 M38 27 V67"/>
    </g>
    <text x="326" y="132" class="mono" fill="#8996a8" font-size="12" text-anchor="middle">PACKAGE</text>

    <path class="flow" d="M360 76 C404 76 420 92 420 118 V151 C420 177 437 189 470 189"/>

    <g transform="translate(470,153)">
      <rect class="box" x="0" y="0" width="84" height="25" rx="6"/>
      <rect class="box" x="0" y="31" width="84" height="25" rx="6"/>
      <rect class="box" x="0" y="62" width="84" height="25" rx="6"/>
      <circle cx="12" cy="12.5" r="2.6" fill="#6cc9ff"/>
      <circle cx="12" cy="43.5" r="2.6" fill="#8487ff"/>
      <circle cx="12" cy="74.5" r="2.6" fill="#b072ff"/>
    </g>
    <text x="512" y="266" class="mono" fill="#8996a8" font-size="12" text-anchor="middle">DEPLOY</text>

    <path class="flow2" d="M560 196 H596"/>
    <path class="flow2" d="M589 190 l8 6-8 6"/>

    <rect class="box" x="606" y="153" width="102" height="76" rx="9"/>
    <path class="chalk" d="M620 210 l18-16 16 8 18-26 20 13"/>
    <path class="fine" d="M638 239 H676 M657 229 V239"/>
    <text x="657" y="266" class="mono" fill="#8996a8" font-size="12" text-anchor="middle">OBSERVE</text>
  </g>

  <!-- feedback loop -->
  <path id="feedback" d="M1515 389 C1430 442 1190 442 1040 412 C870 378 728 393 572 421 C395 452 232 432 135 378" fill="none" stroke="#566278" stroke-width="1.4" stroke-dasharray="7 9" opacity=".7"/>
  <path d="M145 369 l-12 9 13 6" fill="none" stroke="#76849a" stroke-width="1.5"/>
  <text x="735" y="447" class="mono" fill="#5f6c80" font-size="12" letter-spacing="2">FEEDBACK CHANGES THE MODEL</text>

  <text x="1290" y="97" class="sans" fill="#eef3f8" font-size="18" font-weight="600" text-anchor="end">structure → automation → reliability</text>
</svg>
