<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="title desc">
<title id="title">Soheil Salmani | Mathematics × DevOps</title>
<desc id="desc">An animated state-space diagram flows into a CI/CD and observability loop, connecting mathematical reasoning with DevOps systems.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f7f5ef"/>
    <stop offset="0.55" stop-color="#fbfaf6"/>
    <stop offset="1" stop-color="#f7f5ef"/>
  </linearGradient>
  <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#007d9c"/>
    <stop offset="0.55" stop-color="#6656c9"/>
    <stop offset="1" stop-color="#2d8b57"/>
  </linearGradient>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="3.5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="0.35"/>
  </filter>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#ddd8cc" stroke-width="1" opacity="0.33"/>
  </pattern>
  <path id="mainPath" d="M 330 250 C 470 155, 590 320, 735 225 S 1010 135, 1180 220"/>
  <path id="feedbackPath" d="M 1180 220 C 1120 330, 900 338, 790 286 S 560 280, 455 208"/>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .sans { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .thin { stroke-linecap: round; stroke-linejoin: round; }
  </style>
</defs>

<rect width="1400" height="420" rx="24" fill="url(#bg)"/>
<rect x="1" y="1" width="1398" height="418" rx="23" fill="none" stroke="#cfc8ba"/>
<rect width="1400" height="420" rx="24" fill="url(#grid)" opacity="0.48"/>

<!-- identity -->
<g transform="translate(60,58)">
  <text class="sans" x="0" y="0" fill="#5f6875" font-size="13" letter-spacing="4">SOHEIL SALMANI</text>
  <text class="sans" x="0" y="48" fill="#18202b" font-size="36" font-weight="700">MATHEMATICS × DEVOPS</text>
  <text class="mono" x="2" y="79" fill="#5f6875" font-size="15">state · invariants · automation · feedback</text>
</g>

<!-- state space / math -->
<g transform="translate(88,160)" class="thin">
  <line x1="0" y1="92" x2="190" y2="92" stroke="#5f6875" stroke-width="1.3" opacity="0.75"/>
  <line x1="95" y1="7" x2="95" y2="176" stroke="#5f6875" stroke-width="1.3" opacity="0.75"/>
  <path d="M 24 150 C 38 65, 78 25, 126 38 C 170 50, 177 112, 139 137 C 104 160, 67 145, 64 116 C 61 91, 87 75, 108 86 C 124 95, 122 111, 111 117" fill="none" stroke="#007d9c" stroke-width="2.2" opacity="0.9"/>
  <path d="M 28 35 C 58 70, 71 83, 94 92 C 117 101, 143 110, 176 150" fill="none" stroke="#6656c9" stroke-width="1.5" stroke-dasharray="5 7" opacity="0.65"/>
  <circle cx="111" cy="117" r="4.2" fill="#2d8b57" filter="url(#glow)"/>
  <text class="mono" x="5" y="-4" fill="#29323d" font-size="15">dx/dt = Ax</text>
  <text class="mono" x="116" y="69" fill="#5f6875" font-size="12">x*</text>
  <text class="mono" x="6" y="172" fill="#5f6875" font-size="12">phase portrait</text>
</g>

<!-- main mathematical/control flow -->
<use href="#mainPath" fill="none" stroke="url(#signal)" stroke-width="4" opacity="0.92" filter="url(#glow)"/>
<use href="#mainPath" fill="none" stroke="#18202b" stroke-width="1" opacity="0.28"/>
<use href="#feedbackPath" fill="none" stroke="#5f6875" stroke-width="1.5" stroke-dasharray="7 8" opacity="0.58"/>

<!-- moving pulses -->
<g filter="url(#glow)">
  <circle r="5" fill="#007d9c"><animateMotion dur="4.8s" repeatCount="indefinite"><mpath href="#mainPath"/></animateMotion></circle>
  <circle r="4" fill="#6656c9" opacity="0.85"><animateMotion dur="4.8s" begin="-1.6s" repeatCount="indefinite"><mpath href="#mainPath"/></animateMotion></circle>
  <circle r="3.6" fill="#2d8b57" opacity="0.9"><animateMotion dur="4.8s" begin="-3.2s" repeatCount="indefinite"><mpath href="#mainPath"/></animateMotion></circle>
  <circle r="3.2" fill="#6656c9" opacity="0.65"><animateMotion dur="6.2s" repeatCount="indefinite"><mpath href="#feedbackPath"/></animateMotion></circle>
</g>

<!-- bridge annotations -->
<g class="mono" font-size="12">
  <text x="383" y="170" fill="#5f6875">model</text>
  <text x="517" y="306" fill="#5f6875">verify</text>
  <text x="665" y="174" fill="#5f6875">automate</text>
  <text x="823" y="301" fill="#5f6875">deploy</text>
  <text x="1006" y="156" fill="#5f6875">observe</text>
</g>

<!-- control equations -->
<g class="mono" fill="#29323d" font-size="14" opacity="0.82">
  <text x="370" y="143">x(t+1) = f(x(t), u(t))</text>
  <text x="560" y="357">J(x*) = min J(x)</text>
  <text x="739" y="118">desired state</text>
  <text x="1018" y="354">observed state</text>
</g>

<!-- pipeline / control plane -->
<g transform="translate(860,176)" class="thin">
  <g>
    <rect x="0" y="0" width="84" height="56" rx="12" fill="#ffffff" stroke="#cfc8ba"/>
    <text class="mono" x="42" y="24" text-anchor="middle" fill="#007d9c" font-size="15">build</text>
    <text class="mono" x="42" y="42" text-anchor="middle" fill="#5f6875" font-size="10">code</text>
  </g>
  <g transform="translate(104,0)">
    <rect x="0" y="0" width="84" height="56" rx="12" fill="#ffffff" stroke="#cfc8ba"/>
    <text class="mono" x="42" y="24" text-anchor="middle" fill="#6656c9" font-size="15">test</text>
    <text class="mono" x="42" y="42" text-anchor="middle" fill="#5f6875" font-size="10">assert</text>
  </g>
  <g transform="translate(208,0)">
    <rect x="0" y="0" width="84" height="56" rx="12" fill="#ffffff" stroke="#cfc8ba"/>
    <text class="mono" x="42" y="24" text-anchor="middle" fill="#2d8b57" font-size="15">ship</text>
    <text class="mono" x="42" y="42" text-anchor="middle" fill="#5f6875" font-size="10">artifact</text>
  </g>
  <g transform="translate(312,0)">
    <rect x="0" y="0" width="84" height="56" rx="12" fill="#ffffff" stroke="#cfc8ba"/>
    <text class="mono" x="42" y="24" text-anchor="middle" fill="#007d9c" font-size="15">watch</text>
    <text class="mono" x="42" y="42" text-anchor="middle" fill="#5f6875" font-size="10">telemetry</text>
  </g>
  <path d="M84 28 H104 M188 28 H208 M292 28 H312" stroke="#5f6875" stroke-width="1.5" opacity="0.75"/>
  <path d="M396 28 C430 28 430 102 330 102 H88 C28 102 0 76 0 58" fill="none" stroke="#5f6875" stroke-width="1.2" stroke-dasharray="6 7" opacity="0.58"/>
  <text class="mono" x="196" y="120" text-anchor="middle" fill="#5f6875" font-size="11">feedback closes the loop</text>
</g>

<!-- small principle -->
<g transform="translate(60,382)">
  <circle cx="0" cy="0" r="3" fill="#2d8b57"/>
  <text class="mono" x="14" y="5" fill="#5f6875" font-size="12">model the state · reduce surprise · keep the loop observable</text>
</g>
</svg>