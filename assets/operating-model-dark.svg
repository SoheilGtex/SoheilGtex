<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="280" viewBox="0 0 1400 280" role="img">
<defs><style>.s{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}</style></defs>
<rect width="1400" height="280" rx="24" fill="#080b10"/><rect x="1" y="1" width="1398" height="278" rx="23" fill="none" stroke="#253144"/>
<text class="m" x="54" y="42" fill="#8795aa" font-size="11" letter-spacing="2.6">OPERATING MODEL</text>
<g transform="translate(54 66)"><rect width="390" height="160" rx="18" fill="#0d121b" stroke="#253144"/><text class="m" x="24" y="32" fill="#5fd7ff" font-size="12" letter-spacing="1.8">01 / REASON</text><text class="s" x="24" y="70" fill="#f1f5fb" font-size="23" font-weight="700">Make the state legible.</text><text class="m" x="24" y="102" fill="#8795aa" font-size="11.5">invariants · constraints · uncertainty</text><text class="m" x="24" y="126" fill="#8795aa" font-size="11.5">numerical methods · probability · algorithms</text><text class="m" x="24" y="148" fill="#8795aa" font-size="11.5">ask what must remain true</text></g>
<g transform="translate(505 66)"><rect width="390" height="160" rx="18" fill="#0d121b" stroke="#253144"/><text class="m" x="24" y="32" fill="#a189ff" font-size="12" letter-spacing="1.8">02 / BUILD</text><text class="s" x="24" y="70" fill="#f1f5fb" font-size="23" font-weight="700">Turn reasoning into software.</text><text class="m" x="24" y="102" fill="#8795aa" font-size="11.5">Python · APIs · data systems · automation</text><text class="m" x="24" y="126" fill="#8795aa" font-size="11.5">tests · interfaces · reproducible environments</text><text class="m" x="24" y="148" fill="#8795aa" font-size="11.5">make assumptions executable</text></g>
<g transform="translate(956 66)"><rect width="390" height="160" rx="18" fill="#0d121b" stroke="#253144"/><text class="m" x="24" y="32" fill="#6fe1b0" font-size="12" letter-spacing="1.8">03 / OPERATE</text><text class="s" x="24" y="70" fill="#f1f5fb" font-size="23" font-weight="700">Keep reality in the loop.</text><text class="m" x="24" y="102" fill="#8795aa" font-size="11.5">Linux · Docker · CI/CD · security</text><text class="m" x="24" y="126" fill="#8795aa" font-size="11.5">telemetry · failure modes · recovery</text><text class="m" x="24" y="148" fill="#8795aa" font-size="11.5">reduce surprise under change</text></g>
<path d="M444 146H505" stroke="#5fd7ff" stroke-width="2"/><circle cx="474" cy="146" r="4" fill="#5fd7ff"/><path d="M895 146H956" stroke="#a189ff" stroke-width="2"/><circle cx="925" cy="146" r="4" fill="#a189ff"/></svg>