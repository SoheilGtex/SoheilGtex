<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="310" viewBox="0 0 1400 310" role="img" aria-labelledby="title desc">
<title id="title">Operating model</title><desc id="desc">Three connected domains: reason, build, and operate.</desc>
<defs><style>.s{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}</style></defs>
<rect width="1400" height="310" rx="24" fill="#0a0d12"/><rect x="1" y="1" width="1398" height="308" rx="23" fill="none" stroke="#263448"/>
<text class="m" x="54" y="46" fill="#8e9caf" font-size="11" letter-spacing="2.6">OPERATING MODEL</text>
<g transform="translate(54 72)">
  <g><rect width="390" height="178" rx="18" fill="#0f151f" stroke="#263448"/><text class="m" x="24" y="34" fill="#66dcff" font-size="12" letter-spacing="2">01 / REASON</text><text class="s" x="24" y="74" fill="#eef4fb" font-size="25" font-weight="700">Make the state legible.</text><text class="m" x="24" y="108" fill="#8e9caf" font-size="12">invariants · constraints · uncertainty</text><text class="m" x="24" y="132" fill="#8e9caf" font-size="12">numerical methods · probability · algorithms</text><text class="m" x="24" y="156" fill="#8e9caf" font-size="12">ask what must remain true</text></g>
  <g transform="translate(448 0)"><rect width="390" height="178" rx="18" fill="#0f151f" stroke="#263448"/><text class="m" x="24" y="34" fill="#a38cff" font-size="12" letter-spacing="2">02 / BUILD</text><text class="s" x="24" y="74" fill="#eef4fb" font-size="25" font-weight="700">Turn reasoning into software.</text><text class="m" x="24" y="108" fill="#8e9caf" font-size="12">Python · APIs · data systems · automation</text><text class="m" x="24" y="132" fill="#8e9caf" font-size="12">tests · interfaces · reproducible environments</text><text class="m" x="24" y="156" fill="#8e9caf" font-size="12">make assumptions executable</text></g>
  <g transform="translate(896 0)"><rect width="390" height="178" rx="18" fill="#0f151f" stroke="#263448"/><text class="m" x="24" y="34" fill="#78e0af" font-size="12" letter-spacing="2">03 / OPERATE</text><text class="s" x="24" y="74" fill="#eef4fb" font-size="25" font-weight="700">Keep reality in the loop.</text><text class="m" x="24" y="108" fill="#8e9caf" font-size="12">Linux · Docker · CI/CD · security</text><text class="m" x="24" y="132" fill="#8e9caf" font-size="12">telemetry · failure modes · recovery</text><text class="m" x="24" y="156" fill="#8e9caf" font-size="12">reduce surprise under change</text></g>
  <path d="M390 89H448" stroke="#66dcff" stroke-width="2"/><path d="M838 89H896" stroke="#a38cff" stroke-width="2"/>
  <circle cx="419" cy="89" r="4" fill="#66dcff"/><circle cx="867" cy="89" r="4" fill="#a38cff"/>
</g>
</svg>