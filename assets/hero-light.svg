<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%">
  <defs>
    <style>
      .bg { fill: #FAFAFA; }
      .grid { fill: none; stroke: #E4E4E7; stroke-width: 1; }
      .text-title { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-size: 28px; font-weight: 700; fill: #18181B; letter-spacing: -0.02em; }
      .text-subtitle { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11px; font-weight: 600; fill: #0284C7; letter-spacing: 0.1em; }
      .text-body { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 400; fill: #52525B; }
      .text-highlight { fill: #18181B; font-weight: 600; }
      
      /* Diagram Styles */
      .box { fill: #FFFFFF; stroke: #D4D4D8; stroke-width: 1.5; rx: 4px; }
      .box-text { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; fill: #18181B; text-anchor: middle; }
      .math-text { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; fill: #3F3F46; }
      .sub-text { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 9px; fill: #71717A; text-anchor: middle; letter-spacing: 0.05em; }
      .math-equation { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 10px; fill: #71717A; }
      
      /* Signal Flow Animation */
      .signal-path { fill: none; stroke: #D4D4D8; stroke-width: 1.5; }
      .signal-flow { 
        fill: none; 
        stroke: #0284C7; 
        stroke-width: 2; 
        stroke-dasharray: 4 12; 
        animation: flow 1s linear infinite; 
      }
      @keyframes flow { to { stroke-dashoffset: -16; } }
    </style>
    <pattern id="grid-pattern-light" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#E4E4E7" />
    </pattern>
    <marker id="arrow-light" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#A1A1AA" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg" />
  <rect width="100%" height="100%" fill="url(#grid-pattern-light)" />

  <text x="48" y="76" class="text-title">SOHEIL SALMANI</text>
  <text x="50" y="104" class="text-subtitle">DEVOPS ENGINEER / MATHEMATICS + CS</text>

  <text x="50" y="170" class="text-body">
    <tspan x="50" dy="0">I care about systems that can be </tspan>
    <tspan class="text-highlight">reasoned about</tspan>
    <tspan> before they fail,</tspan>
    <tspan x="50" dy="28" class="text-highlight">observed</tspan>
    <tspan> while they run, and </tspan>
    <tspan class="text-highlight">recovered</tspan>
    <tspan> when they do.</tspan>
  </text>
  
  <text x="50" y="270" class="math-equation">
    <tspan x="50" dy="0">1. Reproducible over clever.</tspan>
    <tspan x="50" dy="22">2. Observable over mysterious.</tspan>
    <tspan x="50" dy="22">3. Recoverable over fragile.</tspan>
  </text>

  <g transform="translate(420, 90)">
    <path d="M 0 60 L 60 60" class="signal-path" marker-end="url(#arrow-light)" />
    <path d="M 80 60 L 140 60" class="signal-path" marker-end="url(#arrow-light)" />
    <path d="M 240 60 L 300 60" class="signal-path" marker-end="url(#arrow-light)" />
    <path d="M 400 60 L 460 60" class="signal-path" marker-end="url(#arrow-light)" />
    <path d="M 350 60 L 350 160 L 290 160" class="signal-path" marker-end="url(#arrow-light)" />
    <path d="M 190 160 L 70 160 L 70 75" class="signal-path" marker-end="url(#arrow-light)" />

    <path d="M 0 60 L 60 60" class="signal-flow" />
    <path d="M 80 60 L 140 60" class="signal-flow" />
    <path d="M 240 60 L 300 60" class="signal-flow" />
    <path d="M 400 60 L 460 60" class="signal-flow" />
    <path d="M 350 60 L 350 160 L 290 160" class="signal-flow" />
    <path d="M 190 160 L 70 160 L 70 75" class="signal-flow" />

    <circle cx="70" cy="60" r="12" class="box" />
    <path d="M 64 60 L 76 60 M 70 54 L 70 66" stroke="#A1A1AA" stroke-width="1.5" />
    <text x="60" y="80" class="sub-text">-</text>
    <text x="60" y="50" class="sub-text">+</text>

    <rect x="140" y="40" width="100" height="40" class="box" />
    <text x="190" y="64" class="box-text">CONTROLLER</text>
    <text x="190" y="96" class="sub-text">[ CI / CD PIPELINE ]</text>

    <rect x="300" y="40" width="100" height="40" class="box" />
    <text x="350" y="64" class="box-text">SYSTEM</text>
    <text x="350" y="96" class="sub-text">[ PRODUCTION ]</text>

    <rect x="190" y="140" width="100" height="40" class="box" />
    <text x="240" y="164" class="box-text">SENSOR</text>
    <text x="240" y="196" class="sub-text">[ OBSERVABILITY ]</text>

    <text x="20" y="50" class="math-text">r(t)</text>
    <text x="20" y="32" class="sub-text">Desired State</text>
    
    <text x="100" y="50" class="math-text">e(t)</text>
    <text x="105" y="32" class="sub-text">Drift</text>

    <text x="260" y="50" class="math-text">u(t)</text>
    <text x="265" y="32" class="sub-text">Deploy</text>

    <text x="425" y="50" class="math-text">y(t)</text>
    <text x="425" y="32" class="sub-text">Actual State</text>


    <g transform="translate(140, 250)">
      <text x="0" y="0" class="math-equation">e(t) = r(t) - y(t) ── DRIFT</text>
      <text x="0" y="20" class="math-equation">u(t) = K e(t) ── CORRECTIVE ACTION</text>
    </g>
  </g>
</svg>