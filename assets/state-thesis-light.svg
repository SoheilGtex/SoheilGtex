<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="500" viewBox="0 0 1400 500" role="img" aria-labelledby="title desc">
<title id="title">Soheil Salmani | The Systems Thesis</title>
<desc id="desc">An animated visual thesis connecting mathematical reasoning to reliable software systems through a proof-to-production feedback loop.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f9fc"/><stop offset="0.55" stop-color="#eef3f8"/><stop offset="1" stop-color="#f7f9fc"/></linearGradient>
  <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#007ca8"/><stop offset="0.52" stop-color="#6557c7"/><stop offset="1" stop-color="#168a5b"/></linearGradient>
  <radialGradient id="pulse"><stop offset="0" stop-color="#16202b"/><stop offset="0.32" stop-color="#007ca8"/><stop offset="1" stop-color="#007ca8" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#d7e0ea" stroke-width="1" opacity="0.32"/></pattern>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#52667a" flood-opacity="0.22"/></filter>
  <path id="bridge" d="M345 303 C470 217 545 360 660 286 C770 215 844 210 973 278 C1082 337 1175 292 1282 231"/>
  <path id="feedback" d="M1282 231 C1215 408 1006 422 878 365 C759 312 676 378 552 367 C456 359 395 324 345 303"/>
  <style>
    .sans{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
    .thin{stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>
<rect width="1400" height="500" rx="28" fill="url(#bg)"/>
<rect width="1400" height="500" rx="28" fill="url(#grid)"/>
<rect x="1" y="1" width="1398" height="498" rx="27" fill="none" stroke="#ccd7e4"/>

<!-- masthead -->
<g transform="translate(62 58)">
  <text class="mono" x="0" y="0" fill="#617084" font-size="12" letter-spacing="3.3">THE SYSTEMS THESIS / SOHEIL SALMANI</text>
  <text class="sans" x="0" y="58" fill="#16202b" font-size="44" font-weight="760">Mathematics for structure.</text>
  <text class="sans" x="0" y="109" fill="#16202b" font-size="44" font-weight="760">DevOps for reality.</text>
  <text class="mono" x="2" y="146" fill="#617084" font-size="14">I build at the boundary between abstraction and reliable systems.</text>
</g>

<!-- math field -->
<g transform="translate(66 246)" class="thin">
  <rect x="0" y="0" width="254" height="190" rx="18" fill="#ffffff" stroke="#ccd7e4" filter="url(#softShadow)"/>
  <text class="mono" x="20" y="28" fill="#617084" font-size="10" letter-spacing="2">ABSTRACTION</text>
  <text class="mono" x="20" y="59" fill="#16202b" font-size="14">min J(x)</text>
  <text class="mono" x="20" y="82" fill="#617084" font-size="11">s.t.  g_i(x) &lt;= 0</text>
  <path d="M24 151 C50 102 74 123 96 92 C118 61 143 70 161 102 C179 135 208 110 228 70" fill="none" stroke="#007ca8" stroke-width="2.2" opacity="0.94"/>
  <path d="M30 164 C62 145 90 144 118 150 C151 157 190 151 226 136" fill="none" stroke="#6557c7" stroke-width="1.3" stroke-dasharray="5 7" opacity="0.7"/>
  <circle cx="161" cy="102" r="4.5" fill="#168a5b" filter="url(#glow)"/>
  <text class="mono" x="175" y="96" fill="#617084" font-size="10">x*</text>
  <text class="mono" x="20" y="178" fill="#617084" font-size="10">state · constraints · uncertainty</text>
</g>

<!-- signal bridge -->
<use href="#bridge" fill="none" stroke="url(#signal)" stroke-width="4.2" opacity="0.96" filter="url(#glow)"/>
<use href="#bridge" fill="none" stroke="#16202b" stroke-width="0.9" opacity="0.24"/>
<use href="#feedback" fill="none" stroke="#617084" stroke-width="1.35" stroke-dasharray="7 9" opacity="0.52"/>
<g filter="url(#glow)">
  <circle r="5" fill="#007ca8"><animateMotion dur="5.4s" repeatCount="indefinite"><mpath href="#bridge"/></animateMotion></circle>
  <circle r="4.2" fill="#6557c7" opacity="0.88"><animateMotion dur="5.4s" begin="-1.8s" repeatCount="indefinite"><mpath href="#bridge"/></animateMotion></circle>
  <circle r="3.6" fill="#168a5b" opacity="0.88"><animateMotion dur="5.4s" begin="-3.6s" repeatCount="indefinite"><mpath href="#bridge"/></animateMotion></circle>
  <circle r="3.2" fill="#b85d00" opacity="0.72"><animateMotion dur="7.4s" repeatCount="indefinite"><mpath href="#feedback"/></animateMotion></circle>
</g>

<!-- compiler bridge labels -->
<g class="mono" font-size="10.5" fill="#617084">
  <text x="372" y="252">reason</text><text x="493" y="347">specify</text><text x="627" y="245">automate</text><text x="760" y="226">verify</text><text x="908" y="309">ship</text><text x="1050" y="332">observe</text><text x="1214" y="205">recover</text>
</g>
<g transform="translate(566 272)">
  <rect x="0" y="0" width="214" height="38" rx="19" fill="#ffffff" stroke="#ccd7e4"/>
  <text class="mono" x="107" y="24" text-anchor="middle" fill="#16202b" font-size="11" letter-spacing="1.3">PROOF -&gt; PRODUCTION</text>
</g>

<!-- systems field -->
<g transform="translate(1002 250)" class="thin">
  <rect x="0" y="0" width="332" height="186" rx="18" fill="#ffffff" stroke="#ccd7e4" filter="url(#softShadow)"/>
  <text class="mono" x="20" y="28" fill="#617084" font-size="10" letter-spacing="2">OPERATION</text>
  <g transform="translate(20 48)">
    <rect x="0" y="0" width="64" height="42" rx="10" fill="#f5f8fb" stroke="#ccd7e4"/><text class="mono" x="32" y="25" text-anchor="middle" fill="#007ca8" font-size="10">build</text>
    <rect x="79" y="0" width="64" height="42" rx="10" fill="#f5f8fb" stroke="#ccd7e4"/><text class="mono" x="111" y="25" text-anchor="middle" fill="#6557c7" font-size="10">test</text>
    <rect x="158" y="0" width="64" height="42" rx="10" fill="#f5f8fb" stroke="#ccd7e4"/><text class="mono" x="190" y="25" text-anchor="middle" fill="#168a5b" font-size="10">deploy</text>
    <rect x="237" y="0" width="64" height="42" rx="10" fill="#f5f8fb" stroke="#ccd7e4"/><text class="mono" x="269" y="25" text-anchor="middle" fill="#b85d00" font-size="10">observe</text>
    <path d="M64 21H79 M143 21H158 M222 21H237" stroke="#617084" stroke-width="1.2" opacity="0.75"/>
  </g>
  <g transform="translate(20 112)">
    <text class="mono" x="0" y="0" fill="#617084" font-size="10">desired state</text>
    <text class="mono" x="0" y="24" fill="#16202b" font-size="12">config -&gt; policy -&gt; artifact</text>
    <text class="mono" x="0" y="52" fill="#617084" font-size="10">observed state</text>
    <text class="mono" x="150" y="52" fill="#16202b" font-size="12">telemetry -&gt; feedback</text>
  </g>
</g>

<!-- microline -->
<g transform="translate(66 468)">
  <circle cx="0" cy="0" r="3" fill="#168a5b"/>
  <text class="mono" x="14" y="4" fill="#617084" font-size="10.5">reason about the state · make it reproducible · keep the loop observable</text>
</g>
</svg>